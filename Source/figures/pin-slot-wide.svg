     aria-labelledby="ps-wide-title">
  <title id="ps-wide-title">The pin-and-slot mechanism, drawn exactly: k1 turns at a constant rate and carries a pin; k2, an identical gear with a different centre of rotation, carries the slot the pin rides. The ring shows the consequence, k2’s phase against k1’s: ahead by up to 6.29 degrees through half the turn, behind through the other half.</title>
