<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 527.25"
     class="shelf-plate shelf-tall" role="img" focusable="false"
     aria-labelledby="shelf-tall-title">
  <title id="shelf-tall-title">The library's ten sources as the app's rows: one document per row, title and status dot.</title>
  <text class="shelf-head" x="16.0" y="32.0" font-size="17.82" font-family="Inter, sans-serif">10 sources</text>
  <g class="shelf-rows">
    <text class="shelf-title" x="16.0" y="63.1" font-size="16.5" font-family="Inter, sans-serif">ancient astronomical computer</text>
    <circle class="shelf-dot" cx="326.0" cy="64.0" r="3.4"/>
    <rect class="shelf-band" x="0" y="82.0" width="340" height="57.45"/>
    <text class="shelf-title" x="16.0" y="94.9" font-size="16.5" font-family="Inter, sans-serif">The National Archaeological Museum</text>
    <text class="shelf-title" x="16.0" y="116.3" font-size="16.5" font-family="Inter, sans-serif">in Athens</text>
    <circle class="shelf-dot" cx="326.0" cy="110.7" r="3.4"/>
    <path class="shelf-rule" d="M0 82.0 H340"/>
    <text class="shelf-title" x="16.0" y="156.6" font-size="16.5" font-family="Inter, sans-serif">The Saros cycle</text>
    <circle class="shelf-dot" cx="326.0" cy="157.4" r="3.4"/>
    <path class="shelf-rule" d="M0 139.4 H340"/>
    <rect class="shelf-band" x="0" y="175.4" width="340" height="36"/>
    <text class="shelf-title" x="16.0" y="192.6" font-size="16.5" font-family="Inter, sans-serif">The Metonic cycle</text>
    <circle class="shelf-dot" cx="326.0" cy="193.4" r="3.4"/>
    <path class="shelf-rule" d="M0 175.4 H340"/>
    <text class="shelf-title" x="16.0" y="224.3" font-size="16.5" font-family="Inter, sans-serif">X-ray data from the Antikythera</text>
    <text class="shelf-title" x="16.0" y="245.8" font-size="16.5" font-family="Inter, sans-serif">mechanism's broken calendar ring</text>
    <circle class="shelf-dot" cx="326.0" cy="240.2" r="3.4"/>
    <path class="shelf-rule" d="M0 211.4 H340"/>
    <rect class="shelf-band" x="0" y="268.9" width="340" height="57.45"/>
    <text class="shelf-title" x="16.0" y="281.8" font-size="16.5" font-family="Inter, sans-serif">Fragment C of the Antikythera</text>
    <text class="shelf-title" x="16.0" y="303.2" font-size="16.5" font-family="Inter, sans-serif">mechanism</text>
    <circle class="shelf-dot" cx="326.0" cy="297.6" r="3.4"/>
    <path class="shelf-rule" d="M0 268.9 H340"/>
    <text class="shelf-title" x="16.0" y="339.2" font-size="16.5" font-family="Inter, sans-serif">Reconstruction of the missing front</text>
    <text class="shelf-title" x="16.0" y="360.7" font-size="16.5" font-family="Inter, sans-serif">dial gearing of the Antikythera</text>
    <text class="shelf-title" x="16.0" y="382.1" font-size="16.5" font-family="Inter, sans-serif">mechanism.</text>
    <circle class="shelf-dot" cx="326.0" cy="365.8" r="3.4"/>
    <path class="shelf-rule" d="M0 326.3 H340"/>
    <rect class="shelf-band" x="0" y="405.2" width="340" height="36"/>
    <text class="shelf-title" x="16.0" y="422.4" font-size="16.5" font-family="Inter, sans-serif">Antikythera mechanism</text>
    <circle class="shelf-dot" cx="326.0" cy="423.2" r="3.4"/>
    <path class="shelf-rule" d="M0 405.2 H340"/>
    <text class="shelf-title" x="16.0" y="458.4" font-size="16.5" font-family="Inter, sans-serif">Antikythera wreck</text>
    <circle class="shelf-dot" cx="326.0" cy="459.2" r="3.4"/>
    <path class="shelf-rule" d="M0 441.2 H340"/>
    <rect class="shelf-band" x="0" y="477.2" width="340" height="36"/>
    <text class="shelf-title" x="16.0" y="494.4" font-size="16.5" font-family="Inter, sans-serif">Decoding Antikythera mechanism</text>
    <circle class="shelf-dot" cx="326.0" cy="495.2" r="3.4"/>
    <path class="shelf-rule" d="M0 477.2 H340"/>
  </g>
  <text class="shelf-foot" x="326.0" y="517.2" font-size="16.5" font-family="Inter, sans-serif" text-anchor="end">every one a document on this machine</text></svg>
