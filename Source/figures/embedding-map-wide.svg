<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-label="A library’s passages as positions. The two phrasings of one finding sit nearest each other; keywords reach the note that shares the words, and the near-neighbour circle reaches the subject across the wording." focusable="false" data-variant="wide"><rect x="12" y="52" width="616" height="286" fill="var(--subtle)"/><circle cx="376.00" cy="156.00" r="199.31" fill="none" stroke="var(--witness)" stroke-width="1.5" stroke-dasharray="5 4"/><line x1="376.00" y1="156.00" x2="88.20" y2="322.80" stroke="var(--mist)" stroke-width="1.5"/><circle cx="192.00" cy="178.00" r="5" fill="var(--witness)"/><circle cx="224.00" cy="202.00" r="5" fill="var(--witness)"/><circle cx="67.10" cy="233.90" r="4.4" fill="var(--mist)"/><circle cx="88.20" cy="322.80" r="4.4" fill="var(--mist)"/><circle cx="280.80" cy="352.70" r="4.4" fill="var(--mist)"/><circle cx="372.70" cy="356.20" r="4.4" fill="var(--mist)"/><path d="M376 160 l7 -12 h-14 z" fill="var(--witness)"/><text x="24" y="30" font-family="Inter, system-ui, sans-serif" font-size="16" fill="var(--mist)">one library, two ways to reach it</text><text x="202" y="182" font-family="Inter, system-ui, sans-serif" font-size="16" fill="var(--ink)">a paper: efficacy</text><text x="234" y="206" font-family="Inter, system-ui, sans-serif" font-size="16" fill="var(--ink)">a thesis: how well it worked</text><text x="77.1" y="237.9" font-family="Inter, system-ui, sans-serif" font-size="16" fill="var(--ink)">a paper: adverse events</text><text x="98.2" y="326.8" font-family="Inter, system-ui, sans-serif" font-size="16" fill="var(--ink)">a note: drug safety</text><text x="366" y="142" font-family="Inter, system-ui, sans-serif" font-size="16" fill="var(--witness)" font-weight="600" text-anchor="end">the question: drug safety</text><text x="24" y="376" font-family="Inter, system-ui, sans-serif" font-size="16" fill="var(--mist)">keywords reach the wording, not the subject</text><text x="24" y="396" font-family="Inter, system-ui, sans-serif" font-size="16" fill="var(--ink)" font-weight="600">nearness reaches across the wording</text></svg>