<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 384" width="640" height="384" role="img" aria-label="Attention across a 24-passage window: the early detail gets 31% of the weight the end gets. A retrieval window of 4 passages reads the same detail at 98% of its best." focusable="false" data-variant="wide"><rect x="24" y="78" width="546" height="56" fill="var(--subtle)"/><rect x="24.00" y="108.24" width="20.64" height="25.76" fill="var(--mist)"/><rect x="46.84" y="112.44" width="20.64" height="21.56" fill="var(--mist)"/><rect x="69.68" y="116.64" width="20.64" height="17.36" fill="var(--witness)"/><rect x="92.52" y="116.80" width="20.64" height="17.20" fill="var(--mist)"/><rect x="115.37" y="116.96" width="20.64" height="17.04" fill="var(--mist)"/><rect x="138.21" y="117.12" width="20.64" height="16.88" fill="var(--mist)"/><rect x="161.05" y="117.28" width="20.64" height="16.72" fill="var(--mist)"/><rect x="183.89" y="117.44" width="20.64" height="16.56" fill="var(--mist)"/><rect x="206.73" y="117.60" width="20.64" height="16.40" fill="var(--mist)"/><rect x="229.57" y="117.76" width="20.64" height="16.24" fill="var(--mist)"/><rect x="252.42" y="116.72" width="20.64" height="17.28" fill="var(--mist)"/><rect x="275.26" y="115.68" width="20.64" height="18.32" fill="var(--mist)"/><rect x="298.10" y="114.64" width="20.64" height="19.36" fill="var(--mist)"/><rect x="320.94" y="113.60" width="20.64" height="20.40" fill="var(--mist)"/><rect x="343.78" y="112.56" width="20.64" height="21.44" fill="var(--mist)"/><rect x="366.62" y="111.52" width="20.64" height="22.48" fill="var(--mist)"/><rect x="389.47" y="110.48" width="20.64" height="23.52" fill="var(--mist)"/><rect x="412.31" y="105.84" width="20.64" height="28.16" fill="var(--mist)"/><rect x="435.15" y="101.20" width="20.64" height="32.80" fill="var(--mist)"/><rect x="457.99" y="96.56" width="20.64" height="37.44" fill="var(--mist)"/><rect x="480.83" y="91.92" width="20.64" height="42.08" fill="var(--mist)"/><rect x="503.67" y="87.28" width="20.64" height="46.72" fill="var(--mist)"/><rect x="526.52" y="82.64" width="20.64" height="51.36" fill="var(--mist)"/><rect x="549.36" y="78.00" width="20.64" height="56.00" fill="var(--mist)"/><rect x="24" y="228" width="546" height="56" fill="var(--subtle)"/><rect x="24.00" y="236.96" width="20.64" height="47.04" fill="var(--mist)"/><rect x="46.84" y="233.60" width="20.64" height="50.40" fill="var(--witness)"/><rect x="69.68" y="235.28" width="20.64" height="48.72" fill="var(--mist)"/><rect x="92.52" y="232.48" width="20.64" height="51.52" fill="var(--mist)"/><text x="24" y="30" font-family="Inter, system-ui, sans-serif" font-size="16" fill="var(--mist)">one document, two ways to read it</text><text x="24" y="64" font-family="Inter, system-ui, sans-serif" font-size="16" fill="var(--ink)">the whole document, one window</text><text x="592" y="64" font-family="JetBrains Mono, ui-monospace, Consolas, monospace" font-size="16" fill="var(--ink)" font-weight="600">24</text><text x="24" y="156" font-family="Inter, system-ui, sans-serif" font-size="16" fill="var(--witness)" font-weight="600">the early detail</text><text x="24" y="180" font-family="Inter, system-ui, sans-serif" font-size="16" fill="var(--mist)">the early detail: 31% of the end’s weight</text><text x="24" y="214" font-family="Inter, system-ui, sans-serif" font-size="16" fill="var(--ink)">the handful that bear on the question</text><text x="592" y="214" font-family="JetBrains Mono, ui-monospace, Consolas, monospace" font-size="16" fill="var(--ink)" font-weight="600">4</text><text x="24" y="306" font-family="Inter, system-ui, sans-serif" font-size="16" fill="var(--witness)" font-weight="600">the early detail</text><text x="24" y="330" font-family="Inter, system-ui, sans-serif" font-size="16" fill="var(--mist)">the same detail: 98% of this window’s best</text><text x="24" y="356" font-family="Inter, system-ui, sans-serif" font-size="16" fill="var(--mist)">The shape is the argument,