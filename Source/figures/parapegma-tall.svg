    <text class="pp-key" x="16.0" y="1386.0" font-size="16.5" font-family="GFS Didot, Georgia, serif">Ο</text>
    <text class="pp-greek" x="44.0" y="1386.0" font-size="16.5" font-family="GFS Didot, Georgia, serif" xml:lang="el">ΑΕΤΟΣ ΔΥΝΕΙ ΕΩΙΟΣ</text>
    <text class="pp-key" x="16.0" y="1412.0" font-size="16.5" font-family="GFS Didot, Georgia, serif">Π</text>
    <text class="pp-greek" x="44.0" y="1412.0" font-size="16.5" font-family="GFS Didot, Georgia, serif" xml:lang="el">ΛΕΩΝ ΑΡΧΕΤΑΙ</text>
    <text class="pp-greek" x="44.0" y="1430.0" font-size="16.5" font-family="GFS Didot, Georgia, serif" xml:lang="el">ΕΠΙΤΕΛΛΕΙΝ [...] Α</text>
    <text class="pp-key" x="16.0" y="1456.0" font-size="16.5" font-family="GFS Didot, Georgia, serif">Ρ</text>
    <text class="pp-greek" x="44.0" y="1456.0" font-size="16.5" font-family="GFS Didot, Georgia, serif" xml:lang="el">[...]</text>
    <text class="pp-key" x="16.0" y="1482.0" font-size="16.5" font-family="GFS Didot, Georgia, serif">Σ</text>
    <text class="pp-greek" x="44.0" y="1482.0" font-size="16.5" font-family="GFS Didot, Georgia, serif" xml:lang="el">[...]</text>
    <text class="pp-key" x="16.0" y="1508.0" font-size="16.5" font-family="GFS Didot, Georgia, serif">Τ</text>
    <text class="pp-greek" x="44.0" y="1508.0" font-size="16.5" font-family="GFS Didot, Georgia, serif" xml:lang="el">[...]</text>
    <text class="pp-key" x="16.0" y="1534.0" font-size="16.5" font-family="GFS Didot, Georgia, serif">Υ</text>
    <text class="pp-greek" x="44.0" y="1534.0" font-size="16.5" font-family="GFS Didot, Georgia, serif" xml:lang="el">[...]</text>
    <text class="pp-key" x="16.0" y="1560.0" font-size="16.5" font-family="GFS Didot, Georgia, serif">Φ</text>
    <text class="pp-greek" x="44.0" y="1560.0" font-size="16.5" font-family="GFS Didot, Georgia, serif" xml:lang="el">[...]</text>
    <text class="pp-key" x="16.0" y="1586.0" font-size="16.5" font-family="GFS Didot, Georgia, serif">Χ</text>
