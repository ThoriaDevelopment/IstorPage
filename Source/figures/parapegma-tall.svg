  <title id="pp-tall-title">The parapegma: the register inscribed above and beneath the dials, forty-four rows keyed by Greek letters, damage marks included.</title>
  <text class="pp-title" x="170.0" y="28" font-size="16" font-family="GFS Didot, Georgia, serif" text-anchor="middle">THE PARAPEGMA</text>
  <text class="pp-head" x="170.0" y="66.0" font-size="16" font-family="Inter, sans-serif" text-anchor="middle">ABOVE THE DIALS</text>
  <g class="pp-band">
    <path class="pp-tick" d="M14 828.0 H326"/>
    <circle class="pp-sun" cx="158" cy="828.0" r="4.4"/>
    <circle class="pp-moon" cx="182" cy="828.0" r="3.2"/>
  </g>
    <text class="pp-key" x="16.0" y="92.0" font-size="16.5" font-family="GFS Didot, Georgia, serif">Α</text>
    <text class="pp-greek" x="44.0" y="92.0" font-size="16.5" font-family="GFS Didot, Georgia, serif" xml:lang="el">ΑΙΓΟΚΕΡΩΣ ΑΡΧΕΤΑΙ</text>
    <text class="pp-greek" x="44.0" y="110.0" font-size="16.5" font-family="GFS Didot, Georgia, serif" xml:lang="el">ΑΝΑΤΕΛΛΕΙΝ [...] Α</text>
    <text class="pp-greek" x="44.0" y="136.0" font-size="16.5" font-family="GFS Didot, Georgia, serif" xml:lang="el">ΤΡΟΠΑΙ ΧΕΙΜΕΡΙΝΑΙ [...] Α</text>
    <text class="pp-key" x="16.0" y="162.0" font-size="16.5" font-family="GFS Didot, Georgia, serif">Β</text>
    <text class="pp-greek" x="44.0" y="162.0" font-size="16.5" font-family="GFS Didot, Georgia, serif" xml:lang="el">[...] ΕΙ ΕΣΠΕΡΙ</text>
    <text class="pp-key" x="16.0" y="188.0" font-size="16.5" font-family="GFS Didot, Georgia, serif">Γ</text>
    <text class="pp-greek" x="44.0" y="188.0" font-size="16.5" font-family="GFS Didot, Georgia, serif" xml:lang="el">[...] ΙΕΣΠΕΡΙ</text>
    <text class="pp-key" x="16.0" y="214.0" font-size="16.5" font-family="GFS Didot, Georgia, serif">Δ</text>
    <text class="pp-greek" x="44.0" y="214.0" font-size="16.5" font-family="GFS Didot, Georgia, serif" xml:lang="el">[...] ΥΔΡΟΧΟΟΣ ΑΡΧΕΤΑΙ</text>
    <text class="pp-greek" x="44.0" y="232.0" font-size="16.5" font-family="GFS Didot, Georgia, serif" xml:lang="el">ΕΠΙΤΕΛΛΕΙΝΑ</text>
    <text class="pp-key" x="16.0" y="258.0" font-size="16.5" font-family="GFS Didot, Georgia, serif">Ε</text>
    <text class="pp-greek" x="44.0" y="258.0" font-size="16.5" font-family="GFS Didot, Georgia, serif" xml:lang="el">[...] ΕΣΠΕΡΙΟΣ [...] Ι{Ο}</text>
    <text class="pp-key" x="16.0" y="284.0" font-size="16.5" font-family="GFS Didot, Georgia, serif">Ζ</text>
    <text class="pp-greek" x="44.0" y="284.0" font-size="16.5" font-family="GFS Didot, Georgia, serif" xml:lang="el">[...] ΡΙΑΙ [...] Κ</text>
    <text class="pp-key" x="16.0" y="310.0" font-size="16.5" font-family="GFS Didot, Georgia, serif">Η</text>
    <text class="pp-greek" x="44.0" y="310.0" font-size="16.5" font-family="GFS Didot, Georgia, serif" xml:lang="el">ΙΧΘΥΕΣ ΑΡΧΟΝΤΑΙ</text>
    <text class="pp-greek" x="44.0" y="328.0" font-size="16.5" font-family="GFS Didot, Georgia, serif" xml:lang="el">ΕΠΙΤΕΛΛΕΙΝ [...] Α</text>
    <text class="pp-key" x="16.0" y="354.0" font-size="16.5" font-family="GFS Didot, Georgia, serif">Θ</text>
    <text class="pp-greek" x="44.0" y="354.0" font-size="16.5" font-family="GFS Didot, Georgia, serif" xml:lang="el">[...] {Ι}Α</text>
    <text class="pp-key" x="16.0" y="380.0" font-size="16.5" font-family="GFS Didot, Georgia, serif">Ι</text>
    <text class="pp-greek" x="44.0" y="380.0" font-size="16.5" font-family="GFS Didot, Georgia, serif" xml:lang="el">ΚΡΙΟΣ ΑΡΧΕΤΑΙ ΕΠΙΤΕΛΛΕΙΝ</text>
    <text class="pp-greek" x="44.0" y="398.0" font-size="16.5" font-family="GFS Didot, Georgia, serif" xml:lang="el">[...] Α</text>
    <text class="pp-greek" x="44.0" y="424.0" font-size="16.5" font-family="GFS Didot, Georgia, serif" xml:lang="el">ΙΣΗΜΕΡΙΑ ΕΑΡΙΝΗ [...] Α</text>
    <text class="pp-key" x="16.0" y="450.0" font-size="16.5" font-family="GFS Didot, Georgia, serif">Κ</text>
    <text class="pp-greek" x="44.0" y="450.0" font-size="16.5" font-family="GFS Didot, Georgia, serif" xml:lang="el">[...] ΕΣΠΕΡΙΑ [...] ΙΑ</text>
    <text class="pp-key" x="16.0" y="476.0" font-size="16.5" font-family="GFS Didot, Georgia, serif">Λ</text>
    <text class="pp-greek" x="44.0" y="476.0" font-size="16.5" font-family="GFS Didot, Georgia, serif" xml:lang="el">ΥΑΔΕΣ ΔΥΝΟΥΣΙΝ</text>
    <text class="pp-greek" x="44.0" y="494.0" font-size="16.5" font-family="GFS Didot, Georgia, serif" xml:lang="el">ΕΣΠΕΡΙΑΙ [...] ΚΑ</text>
    <text class="pp-key" x="16.0" y="520.0" font-size="16.5" font-family="GFS Didot, Georgia, serif">Μ</text>
    <text class="pp-greek" x="44.0" y="520.0" font-size="16.5" font-family="GFS Didot, Georgia, serif" xml:lang="el">ΤΑΥΡΟΣ ΑΡΧΕΤΑΙ</text>
    <text class="pp-greek" x="44.0" y="538.0" font-size="16.5" font-family="GFS Didot, Georgia, serif" xml:lang="el">Ε{Π}ΙΤΕΛΛΕΙΝΑ</text>
    <text class="pp-key" x="16.0" y="564.0" font-size="16.5" font-family="GFS Didot, Georgia, serif">Ν</text>
    <text class="pp-greek" x="44.0" y="564.0" font-size="16.5" font-family="GFS Didot, Georgia, serif" xml:lang="el">ΛΥΡΑ ΕΠΙΤΕΛΛΕΙ</text>
    <text class="pp-greek" x="44.0" y="582.0" font-size="16.5" font-family="GFS Didot, Georgia, serif" xml:lang="el">ΕΣΠΕΡΙΛ [...] Δ</text>
    <text class="pp-key" x="16.0" y="608.0" font-size="16.5" font-family="GFS Didot, Georgia, serif">Ξ</text>
    <text class="pp-greek" x="44.0" y="608.0" font-size="16.5" font-family="GFS Didot, Georgia, serif" xml:lang="el">ΠΛΕΙΑΣ ΕΠΙΤΕΛΛΕΙ</text>
    <text class="pp-greek" x="44.0" y="626.0" font-size="16.5" font-family="GFS Didot, Georgia, serif" xml:lang="el">ΕΩΙΑ [...] Ι</text>
    <text class="pp-key" x="16.0" y="652.0" font-size="16.5" font-family="GFS Didot, Georgia, serif">Ο</text>
