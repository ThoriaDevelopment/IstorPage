    <text class="pp-key" x="16.0" y="678.0" font-size="16.5" font-family="GFS Didot, Georgia, serif">Π</text>
    <text class="pp-greek" x="44.0" y="678.0" font-size="16.5" font-family="GFS Didot, Georgia, serif" xml:lang="el">ΔΙΔΥΜΟΙ ΑΡΧΟΝΤΑ</text>
    <text class="pp-greek" x="44.0" y="696.0" font-size="16.5" font-family="GFS Didot, Georgia, serif" xml:lang="el">ΕΠΙΤΕΛΛΕΙΝ [...] Α</text>
    <text class="pp-key" x="16.0" y="722.0" font-size="16.5" font-family="GFS Didot, Georgia, serif">Ρ</text>
    <text class="pp-greek" x="44.0" y="722.0" font-size="16.5" font-family="GFS Didot, Georgia, serif" xml:lang="el">ΑΕΤΟΣ ΕΠΙΤΕΛΛΕΙ ΕΣΠΕΡΙΟΣ</text>
    <text class="pp-key" x="16.0" y="748.0" font-size="16.5" font-family="GFS Didot, Georgia, serif">Σ</text>
    <text class="pp-greek" x="44.0" y="748.0" font-size="16.5" font-family="GFS Didot, Georgia, serif" xml:lang="el">ΑΡΚΤΟΥΡΟΣ ΔΥΝΕΙ Ε{Ω}{Ι}ΟΣ</text>
  <text class="pp-head" x="170.0" y="788.0" font-size="16" font-family="Inter, sans-serif" text-anchor="middle">BENEATH THE DIALS</text>
