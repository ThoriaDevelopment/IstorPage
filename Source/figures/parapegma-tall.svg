    <text class="pp-greek" x="44.0" y="1064.0" font-size="16.5" font-family="GFS Didot, Georgia, serif" xml:lang="el">ΑΝΑΤΕΛΛΕΙΝΑ</text>
    <text class="pp-key" x="16.0" y="1090.0" font-size="16.5" font-family="GFS Didot, Georgia, serif">Ζ</text>
    <text class="pp-greek" x="44.0" y="1090.0" font-size="16.5" font-family="GFS Didot, Georgia, serif" xml:lang="el">[...]</text>
    <text class="pp-key" x="16.0" y="1116.0" font-size="16.5" font-family="GFS Didot, Georgia, serif">Η</text>
    <text class="pp-greek" x="44.0" y="1116.0" font-size="16.5" font-family="GFS Didot, Georgia, serif" xml:lang="el">[...]</text>
    <text class="pp-key" x="16.0" y="1142.0" font-size="16.5" font-family="GFS Didot, Georgia, serif">Θ</text>
    <text class="pp-greek" x="44.0" y="1142.0" font-size="16.5" font-family="GFS Didot, Georgia, serif" xml:lang="el">[...]</text>
    <text class="pp-key" x="16.0" y="1168.0" font-size="16.5" font-family="GFS Didot, Georgia, serif">Ι</text>
    <text class="pp-greek" x="44.0" y="1168.0" font-size="16.5" font-family="GFS Didot, Georgia, serif" xml:lang="el">ΤΟΞΟΤΗΣ ΑΡΧΕΤΑΙ</text>
    <text class="pp-greek" x="44.0" y="1186.0" font-size="16.5" font-family="GFS Didot, Georgia, serif" xml:lang="el">ΕΠΙΤΕΛΛΕΙΝ [...] Α</text>
    <text class="pp-key" x="16.0" y="1212.0" font-size="16.5" font-family="GFS Didot, Georgia, serif">Κ</text>
    <text class="pp-greek" x="44.0" y="1212.0" font-size="16.5" font-family="GFS Didot, Georgia, serif" xml:lang="el">[...]</text>
    <text class="pp-key" x="16.0" y="1238.0" font-size="16.5" font-family="GFS Didot, Georgia, serif">Λ</text>
    <text class="pp-greek" x="44.0" y="1238.0" font-size="16.5" font-family="GFS Didot, Georgia, serif" xml:lang="el">[...]</text>
    <text class="pp-key" x="16.0" y="1264.0" font-size="16.5" font-family="GFS Didot, Georgia, serif">Μ</text>
    <text class="pp-greek" x="44.0" y="1264.0" font-size="16.5" font-family="GFS Didot, Georgia, serif" xml:lang="el">ΚΑΡΚΙΝΟΣ ΑΡΧΕΤΑΙ</text>
    <text class="pp-greek" x="44.0" y="1282.0" font-size="16.5" font-family="GFS Didot, Georgia, serif" xml:lang="el">[...] Α</text>
    <text class="pp-greek" x="44.0" y="1308.0" font-size="16.5" font-family="GFS Didot, Georgia, serif" xml:lang="el">ΤΡΟΠΑΙ ΘΕΡΙΝΑΙ [...] Α</text>
    <text class="pp-key" x="16.0" y="1334.0" font-size="16.5" font-family="GFS Didot, Georgia, serif">Ν</text>
