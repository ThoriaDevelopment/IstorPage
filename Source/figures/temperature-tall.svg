y="0.46" data-k="seg"/><text x="22" y="26" font-family="Inter, system-ui, sans-serif" font-size="15" fill="var(--mist)">one list of odds, three temperatures</text><text x="38" y="54" font-family="Inter, system-ui, sans-serif" font-size="15" fill="var(--ink)">clear</text><text x="111.75" y="54" font-family="Inter, system-ui, sans-serif" font-size="15" fill="var(--mist)">similar</text><text x="201.4" y="54" font-family="Inter, system-ui, sans-serif" font-size="15" fill="var(--mist)">mixed</text><text x="275.15" y="54" font-family="Inter, system-ui, sans-serif" font-size="15" fill="var(--mist)">vague</text><text x="22" y="88" font-family="Inter, system-ui, sans-serif" font-size="15" fill="var(--mist)" font-weight="600">temperature</text><text x="117.45" y="88" font-family="JetBrains Mono, ui-monospace, Consolas, monospace" font-size="16" fill="var(--ink)" font-weight="600">0.5</text><text x="356" y="88" font-family="JetBrains Mono, ui-monospace, Consolas, monospace" font-size="16" fill="var(--ink)" font-weight="600" text-anchor="end">57.4%</text><text x="22" y="168" font-family="Inter, system-ui, sans-serif" font-size="15" fill="var(--mist)" font-weight="600">temperature</text><text x="117.45" y="168" font-family="JetBrains Mono, ui-monospace, Consolas, monospace" font-size="16" fill="var(--ink)" font-weight="600">1</text><text x="356" y="168" font-family="JetBrains Mono, ui-monospace, Consolas, monospace" font-size="16" fill="var(--ink)" font-weight="600" text-anchor="end">41.3%</text><text x="22" y="248" font-family="Inter, system-ui, sans-serif" font-size="15" fill="var(--mist)" font-weight="600">temperature</text><text x="117.45" y="248" font-family="JetBrains Mono, ui-monospace, Consolas, monospace" font-size="16" fill="var(--ink)" font-weight="600">2</text><text x="356" y="248" font-family="JetBrains Mono, ui-monospace, Consolas, monospace" font-size="16" fill="var(--ink)" font-weight="600" text-anchor="end">32.9%</text><text x="22" y="312" font-family="Inter, system-ui, sans-serif" font-size="15" fill="var(--mist)">The same odds, divided by the setting</text><text x="22" y="330" font-family="Inter, system-ui, sans-serif" font-size="15" fill="var(--mist)">and normalised back to 100 percent.</text><text x="22" y="348" font-family="Inter, system-ui, sans-serif" font-size="15" fill="var(--mist)">The candidate list is made up.</text></svg>