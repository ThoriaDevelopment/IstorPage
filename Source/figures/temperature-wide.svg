opacity="0.46" data-k="seg"/><text x="24" y="30" font-family="Inter, system-ui, sans-serif" font-size="16" fill="var(--mist)">one list of odds, three temperatures</text><text x="40" y="62" font-family="Inter, system-ui, sans-serif" font-size="16" fill="var(--ink)">clear</text><text x="120.4" y="62" font-family="Inter, system-ui, sans-serif" font-size="16" fill="var(--mist)">similar</text><text x="217.76" y="62" font-family="Inter, system-ui, sans-serif" font-size="16" fill="var(--mist)">mixed</text><text x="298.16" y="62" font-family="Inter, system-ui, sans-serif" font-size="16" fill="var(--mist)">vague</text><text x="24" y="100" font-family="Inter, system-ui, sans-serif" font-size="16" fill="var(--mist)" font-weight="600">temperature</text><text x="125.28" y="100" font-family="JetBrains Mono, ui-monospace, Consolas, monospace" font-size="22" fill="var(--ink)" font-weight="600">0.5</text><text x="616" y="100" font-family="JetBrains Mono, ui-monospace, Consolas, monospace" font-size="22" fill="var(--ink)" font-weight="600" text-anchor="end">57.4%</text><text x="24" y="192" font-family="Inter, system-ui, sans-serif" font-size="16" fill="var(--mist)" font-weight="600">temperature</text><text x="125.28" y="192" font-family="JetBrains Mono, ui-monospace, Consolas, monospace" font-size="22" fill="var(--ink)" font-weight="600">1</text><text x="616" y="192" font-family="JetBrains Mono, ui-monospace, Consolas, monospace" font-size="22" fill="var(--ink)" font-weight="600" text-anchor="end">41.3%</text><text x="24" y="284" font-family="Inter, system-ui, sans-serif" font-size="16" fill="var(--mist)" font-weight="600">temperature</text><text x="125.28" y="284" font-family="JetBrains Mono, ui-monospace, Consolas, monospace" font-size="22" fill="var(--ink)" font-weight="600">2</text><text x="616" y="284" font-family="JetBrains Mono, ui-monospace, Consolas, monospace" font-size="22" fill="var(--ink)" font-weight="600" text-anchor="end">32.9%</text><text x="24" y="352" font-family="Inter, system-ui, sans-serif" font-size="16" fill="var(--mist)">The same odds, divided by the setting</text><text x="24" y="371" font-family="Inter, system-ui, sans-serif" font-size="16" fill="var(--mist)">and normalised back to 100 percent.</text><text x="24" y="390" font-family="Inter, system-ui, sans-serif" font-size="16" fill="var(--mist)">The candidate list is made up.</text></svg>