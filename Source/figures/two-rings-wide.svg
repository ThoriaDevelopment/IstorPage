<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400"
     class="two-rings two-wide" role="img" focusable="false"
     aria-labelledby="two-rings-wide-title">
  <title id="two-rings-wide-title">The disputed count drawn twice: a ring of 354 holes and a ring of
    355 on the same radius, anchored at 12 o’clock, parting company as
    they run; the lens at six o’clock shows the far side magnified twelve
    times, where the two streams of holes separate.</title>
  <g class="tr-band">
    <circle class="tr-frame" cx="320.0" cy="168.0" r="142.0"/>
    <circle class="tr-frame" cx="320.0" cy="168.0" r="116.0"/>
  </g>
    <circle class="tr-ring-a" cx="320.0" cy="168.0" r="128.0" stroke-dasharray="0.02 2.251886" transform="rotate(-90 320.0 168.0)"/>
    <circle class="tr-ring-b" cx="320.0" cy="168.0" r="128.0" stroke-dasharray="0.02 2.245487" transform="rotate(-90 320.0 168.0)"/>
  <g class="tr-anchor">
    <circle class="tr-anchor-dot" cx="320.00" cy="40.00" r="1.4"/>
  </g>
  <g class="tr-lens">
    <clipPath id="tr-lens-clip-wide">      <circle cx="320.0" cy="260.0" r="40.0"/>    </clipPath>
    <g clip-path="url(#tr-lens-clip-wide)">
      <g transform="translate(320.00 260.00) scale(12.0) translate(-320.00 -296.00)">
        <g class="tr-lens-strokes">
      <circle class="tr-lens-a" cx="320.0" cy="168.0" r="128.0" stroke-dasharray="0.02 2.251886" transform="rotate(-90 320.0 168.0)"/>
      <circle class="tr-lens-b" cx="320.0" cy="168.0" r="128.0" stroke-dasharray="0.02 2.245487" transform="rotate(-90 320.0 168.0)"/>
        </g>
      </g>
    </g>
    <circle class="tr-lens-glass" cx="320.0" cy="260.0" r="40.0"/>
    <path class="tr-lens-line" d="M320.00 293.00 L320.00 220.00"/>
  </g>
  <g class="tr-labels">
    <text class="tr-count-a" x="310.0" y="320.0" font-size="12.5" font-family="Inter, sans-serif" font-weight="600" text-anchor="end">354 holes</text>
    <text class="tr-count-b" x="330.0" y="320.0" font-size="12.5" font-family="Inter, sans-serif" font-weight="600" text-anchor="start">355 holes</text>
  </g>
  <text class="tr-mag" x="320.0" y="341.2" font-size="12.5" font-family="Inter, sans-serif" text-anchor="middle">twelve times larger</text>
</svg>
