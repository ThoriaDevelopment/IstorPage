<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 424" width="640" height="424" role="img" aria-label="Four example speeds against the reading bar at six pieces per second: 4 under it, 12 clearing it, 25 faster than reading, 90 a datacenter number. While one answer is written the rate drifts from 30 to 18 and finishes above the bar." focusable="false" data-variant="wide"><rect x="24" y="186" width="546" height="2" fill="var(--subtle)"/><rect x="23.00" y="180.00" width="2.00" height="14.00" fill="var(--mist)"/><rect x="159.50" y="180.00" width="2.00" height="14.00" fill="var(--mist)"/><rect x="296.00" y="180.00" width="2.00" height="14.00" fill="var(--mist)"/><rect x="432.50" y="180.00" width="2.00" height="14.00" fill="var(--mist)"/><rect x="569.00" y="180.00" width="2.00" height="14.00" fill="var(--mist)"/><rect x="55.76" y="82" width="2.00" height="104" fill="var(--witness)"/><rect x="24" y="354.75" width="546" height="2.00" fill="var(--witness)"/><path d="M24 298.75 L115 305.875 L206 313 L297 317.75 L388 322.5 L479 324.875 L570 327.25" fill="none" stroke="var(--mist)" stroke-width="3"/><text x="24" y="30" font-family="Inter, system-ui, sans-serif" font-size="16" fill="var(--mist)">the axis is the page’s own: pieces per second</text><text x="24" y="64" font-family="Inter, system-ui, sans-serif" font-size="16" fill="var(--ink)">four example speeds, one bar</text><text x="45.84" y="125.68" font-family="JetBrains Mono, ui-monospace, Consolas, monospace" font-size="16" fill="var(--ink)" text-anchor="middle">4</text><text x="24" y="230" font-family="Inter, system-ui, sans-serif" font-size="16" fill="var(--mist)">under the bar</text><text x="89.52" y="125.68" font-family="JetBrains Mono, ui-monospace, Consolas, monospace" font-size="16" fill="var(--ink)" text-anchor="middle">12</text><text x="89.52" y="206" font-family="Inter, system-ui, sans-serif" font-size="16" fill="var(--mist)" text-anchor="middle">clears the bar</text><text x="160.5" y="125.68" font-family="JetBrains Mono, ui-monospace, Consolas, monospace" font-size="16" fill="var(--ink)" text-anchor="middle">25</text><text x="160.5" y="254" font-family="Inter, system-ui, sans-serif" font-size="16" fill="var(--mist)" text-anchor="middle">faster than reading</text><text x="515.4" y="125.68" font-family="JetBrains Mono, ui-monospace, Consolas, monospace" font-size="16" fill="var(--ink)" text-anchor="middle">90</text><text x="570" y="206" font-family="Inter, system-ui, sans-serif" font-size="16" fill="var(--mist)" text-anchor="end">a datacenter number</text><text x="66.76" y="100" font-family="Inter, system-ui, sans-serif" font-size="16" fill="var(--witness)" font-weight="600">the reading bar</text><text x="24" y="276" font-family="Inter, system-ui, sans-serif" font-size="16" fill="var(--ink)">the rate while one answer is written</text><text x="26" y="324.406" font-family="JetBrains Mono, ui-monospace, Consolas, monospace" font-size="16" fill="var(--ink)">starts at 30</text><text x="568" y="311.25" font-family="JetBrains Mono, ui-monospace, Consolas, monospace" font-size="16" fill="var(--ink)" text-anchor="end">ends at 18</text><text x="24" y="347.75" font-family="Inter, system-ui, sans-serif" font-size="16" fill="var(--witness)">the reading bar</text><text x="24" y="398" font-family="Inter, system-ui, sans-serif" font-size="16" fill="var(--mist)">Speeds are examples, not measurements.</text><text x="24" y="417" font-family="Inter, system-ui, sans-serif" font-size="16" fill="var(--mist)">The bar sits in the five-to-ten band.</text></svg>