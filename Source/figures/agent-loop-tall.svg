<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 368" width="380" height="368" role="img" aria-label="Ordinary chat is one pass from question to answer. An agent bends that pass through a tool and back into the model, and at the model decides: call a tool, or it is done." focusable="false" data-variant="tall"><rect x="22" y="72" width="80" height="28" rx="6" fill="var(--subtle)" stroke="var(--mist)" stroke-width="1.5"/><rect x="110" y="158" width="160" height="34" rx="6" fill="var(--subtle)" stroke="var(--mist)" stroke-width="1.5"/><rect x="142" y="268" width="96" height="28" rx="6" fill="var(--subtle)" stroke="var(--mist)" stroke-width="1.5"/><rect x="298" y="72" width="80" height="28" rx="6" fill="var(--subtle)" stroke="var(--mist)" stroke-width="1.5"/><line x1="102" y1="86" x2="292.4" y2="86" stroke="var(--mist)" stroke-width="2"/><polygon points="298,86 291,89.15 291,82.85" fill="var(--mist)"/><line x1="102" y1="86" x2="109.466" y2="163.985" stroke="var(--witness)" stroke-width="2.5"/><polygon points="110,169.56 106.197,162.892 112.469,162.292" fill="var(--witness)"/><line x1="190" y1="192" x2="190" y2="262.4" stroke="var(--witness)" stroke-width="2.5"/><polygon points="190,268 186.85,261 193.15,261" fill="var(--witness)"/><line x1="238" y1="282" x2="268.253" y2="189.841" stroke="var(--witness)" stroke-width="2.5"/><polygon points="270,184.52 270.81,192.153 264.824,190.188" fill="var(--witness)"/><line x1="222" y1="158" x2="325.066" y2="102.65" stroke="var(--witness)" stroke-width="2.5"/><polygon points="330,100 325.323,106.087 322.343,100.537" fill="var(--witness)"/><text x="22" y="26" font-family="Inter, system-ui, sans-serif" font-size="15" fill="var(--mist)">a loop, not a single answer</text><text x="62" y="91.1" font-family="Inter, system-ui, sans-serif" font-size="15" fill="var(--ink)" font-weight="600" text-anchor="middle">question</text><text x="190" y="180.1" font-family="Inter, system-ui, sans-serif" font-size="15" fill="var(--ink)" font-weight="600" text-anchor="middle">model</text><text x="190" y="287.1" font-family="Inter, system-ui, sans-serif" font-size="15" fill="var(--ink)" font-weight="600" text-anchor="middle">tool</text><text x="338" y="91.1" font-family="Inter, system-ui, sans-serif" font-size="15" fill="var(--ink)" font-weight="600" text-anchor="middle">answer</text><text x="200" y="78" font-family="Inter, system-ui, sans-serif" font-size="15" fill="var(--mist)" text-anchor="middle">ordinary chat: one pass</text><text x="182" y="232" font-family="Inter, system-ui, sans-serif" font-size="15" fill="var(--mist)" text-anchor="end">names an action</text><text x="244" y="302" font-family="Inter, system-ui, sans-serif" font-size="15" fill="var(--mist)">result, as text</text><text x="292" y="112" font-family="Inter, system-ui, sans-serif" font-size="15" fill="var(--mist)" text-anchor="end">decides it is done</text><text x="22" y="336" font-family="Inter, system-ui, sans-serif" font-size="15" fill="var(--mist)">Chat is one pass. The agent bends it.</text><text x="22" y="354" font-family="Inter, system-ui, sans-serif" font-size="15" fill="var(--mist)">Each turn is still ordinary inference.</text></svg>