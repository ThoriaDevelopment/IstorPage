<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 344" width="640" height="344" role="img" aria-label="Ordinary chat is one pass from question to answer. An agent bends that pass through a tool and back into the model, and at the model decides: call a tool, or it is done." focusable="false" data-variant="wide"><rect x="24" y="78" width="116" height="32" rx="6" fill="var(--subtle)" stroke="var(--mist)" stroke-width="1.5"/><rect x="242" y="170" width="156" height="36" rx="6" fill="var(--subtle)" stroke="var(--mist)" stroke-width="1.5"/><rect x="272" y="262" width="100" height="30" rx="6" fill="var(--subtle)" stroke="var(--mist)" stroke-width="1.5"/><rect x="500" y="78" width="116" height="32" rx="6" fill="var(--subtle)" stroke="var(--mist)" stroke-width="1.5"/><line x1="140" y1="94" x2="494.4" y2="94" stroke="var(--mist)" stroke-width="2"/><polygon points="500,94 493,97.15 493,90.85" fill="var(--mist)"/><line x1="140" y1="94" x2="237.765" y2="178.576" stroke="var(--witness)" stroke-width="2.5"/><polygon points="242,182.24 234.645,180.042 238.767,175.278" fill="var(--witness)"/><line x1="320" y1="206" x2="321.8" y2="256.404" stroke="var(--witness)" stroke-width="2.5"/><polygon points="322,262 318.602,255.117 324.898,254.892" fill="var(--witness)"/><line x1="372" y1="277" x2="396.248" y2="203.399" stroke="var(--witness)" stroke-width="2.5"/><polygon points="398,198.08 398.801,205.714 392.818,203.743" fill="var(--witness)"/><line x1="351.2" y1="170" x2="541.047" y2="111.645" stroke="var(--witness)" stroke-width="2.5"/><polygon points="546.4,110 540.634,115.068 538.783,109.046" fill="var(--witness)"/><text x="24" y="30" font-family="Inter, system-ui, sans-serif" font-size="16" fill="var(--mist)">a loop, not a single answer</text><text x="82" y="99.44" font-family="Inter, system-ui, sans-serif" font-size="16" fill="var(--ink)" font-weight="600" text-anchor="middle">question</text><text x="320" y="193.44" font-family="Inter, system-ui, sans-serif" font-size="16" fill="var(--ink)" font-weight="600" text-anchor="middle">model</text><text x="322" y="282.44" font-family="Inter, system-ui, sans-serif" font-size="16" fill="var(--ink)" font-weight="600" text-anchor="middle">tool</text><text x="558" y="99.44" font-family="Inter, system-ui, sans-serif" font-size="16" fill="var(--ink)" font-weight="600" text-anchor="middle">answer</text><text x="320" y="86" font-family="Inter, system-ui, sans-serif" font-size="16" fill="var(--mist)" text-anchor="middle">ordinary chat: one pass</text><text x="312" y="232" font-family="Inter, system-ui, sans-serif" font-size="16" fill="var(--mist)" text-anchor="end">names an action</text><text x="404" y="250" font-family="Inter, system-ui, sans-serif" font-size="16" fill="var(--mist)">result, as text</text><text x="496" y="116" font-family="Inter, system-ui, sans-serif" font-size="16" fill="var(--mist)" text-anchor="end">decides it is done</text><text x="24" y="318" font-family="Inter, system-ui, sans-serif" font-size="16" fill="var(--mist)">Chat is one pass. The agent bends it.</text><text x="24" y="337" font-family="Inter, system-ui, sans-serif" font-size="16" fill="var(--mist)">Each turn is still ordinary inference.</text></svg>