    <text class="gd-name" x="235.7" y="235.7" font-size="16.5" font-family="GFS Didot, Georgia, serif" text-anchor="middle">ΝΕΜΕΑ</text>
    <text class="gd-name" x="217.7" y="217.7" font-size="16.5" font-family="GFS Didot, Georgia, serif" text-anchor="middle">ΝΑΑ</text>
