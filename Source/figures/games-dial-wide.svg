<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 384"
     class="games-plate games-wide" role="img" focusable="false"
     aria-labelledby="games-wide-title">
  <title id="games-wide-title">The games dial of the Antikythera mechanism:
    four sectors carrying the year ordinals LΑ, LΒ, LΓ and LΔ, and the names
    of the two games held in each year of the cycle - Isthmia and Olympia,
    Nemea and Naa, Isthmia and Pythia, Nemea and Halieia. The pointer’s arrow
    runs anticlockwise, the only one on the mechanism that does.</title>
  <g class="games-dial">
    <path class="gd-sector" d="M323.4 40.0 A128.0 128.0 0 0 1 448.0 164.6 L321.2 121.9 Z"/>
    <path class="gd-arc" d="M323.4 40.0 A128.0 128.0 0 0 1 448.0 164.6"/>
    <path class="gd-arc" d="M321.2 121.9 A46.1 46.1 0 0 1 366.1 166.8"/>
    <path class="gd-spoke" d="M321.2 121.9 L323.4 40.0"/>
    <text class="gd-ordinal" x="391.8" y="96.2" font-size="16.5" font-family="GFS Didot, Georgia, serif" text-anchor="middle">LΑ</text>
    <text class="gd-name" x="374.6" y="113.4" font-size="12.5" font-family="GFS Didot, Georgia, serif" text-anchor="middle">ΙΣΘΜΙΑ</text>
    <text class="gd-name" x="357.4" y="130.6" font-size="12.5" font-family="GFS Didot, Georgia, serif" text-anchor="middle">ΟΛΥΜΠΙΑ</text>
    <path class="gd-sector" d="M448.0 171.4 A128.0 128.0 0 0 1 323.4 296.0 L366.1 169.2 Z"/>
    <path class="gd-arc" d="M448.0 171.4 A128.0 128.0 0 0 1 323.4 296.0"/>
    <path class="gd-arc" d="M366.1 169.2 A46.1 46.1 0 0 1 321.2 214.1"/>
    <path class="gd-spoke" d="M366.1 169.2 L448.0 171.4"/>
    <text class="gd-ordinal" x="391.8" y="239.8" font-size="16.5" font-family="GFS Didot, Georgia, serif" text-anchor="middle">LΒ</text>
    <text class="gd-name" x="374.6" y="222.6" font-size="12.5" font-family="GFS Didot, Georgia, serif" text-anchor="middle">ΝΕΜΕΑ</text>
    <text class="gd-name" x="357.4" y="205.4" font-size="12.5" font-family="GFS Didot, Georgia, serif" text-anchor="middle">ΝΑΑ</text>
    <path class="gd-sector" d="M316.6 296.0 A128.0 128.0 0 0 1 192.0 171.4 L318.8 214.1 Z"/>
    <path class="gd-arc" d="M316.6 296.0 A128.0 128.0 0 0 1 192.0 171.4"/>
    <path class="gd-arc" d="M318.8 214.1 A46.1 46.1 0 0 1 273.9 169.2"/>
    <path class="gd-spoke" d="M318.8 214.1 L316.6 296.0"/>
    <text class="gd-ordinal" x="248.2" y="239.8" font-size="16.5" font-family="GFS Didot, Georgia, serif" text-anchor="middle">LΓ</text>
    <text class="gd-name" x="265.4" y="222.6" font-size="12.5" font-family="GFS Didot, Georgia, serif" text-anchor="middle">ΙΣΘΜΙΑ</text>
    <text class="gd-name" x="282.6" y="205.4" font-size="12.5" font-family="GFS Didot, Georgia, serif" text-anchor="middle">ΠΥΘΙΑ</text>
    <path class="gd-sector" d="M192.0 164.6 A128.0 128.0 0 0 1 316.6 40.0 L273.9 166.8 Z"/>
    <path class="gd-arc" d="M192.0 164.6 A128.0 128.0 0 0 1 316.6 40.0"/>
    <path class="gd-arc" d="M273.9 166.8 A46.1 46.1 0 0 1 318.8 121.9"/>
    <path class="gd-spoke" d="M273.9 166.8 L192.0 164.6"/>
    <text class="gd-ordinal" x="248.2" y="96.2" font-size="16.5" font-family="GFS Didot, Georgia, serif" text-anchor="middle">LΔ</text>
    <text class="gd-name" x="265.4" y="113.4" font-size="12.5" font-family="GFS Didot, Georgia, serif" text-anchor="middle">ΝΕΜΕΑ</text>
    <text class="gd-name" x="282.6" y="130.6" font-size="12.5" font-family="GFS Didot, Georgia, serif" text-anchor="middle">ΑΛΙΕΙΑ</text>
    <path class="gd-spoke" d="M366.1 169.2 L448.0 171.4"/>
    <path class="gd-spoke" d="M318.8 214.1 L316.6 296.0"/>
    <path class="gd-spoke" d="M273.9 166.8 L192.0 164.6"/>
  </g>
  <g class="gd-pointer">
    <path class="gd-shaft" d="M320.0 115.9 L320.0 26.0"/>
    <path class="gd-arrow" d="M328.2 29.7 L320.0 26.0 L328.2 22.3"/>
  </g>
  <text class="games-count" x="320.0" y="340.0"
        font-size="16.5" text-anchor="middle">four years</text>
  <text class="games-sub" x="320.0" y="362.0"
        font-size="12.5" text-anchor="middle">the only pointer that runs anticlockwise</text>
</svg>
