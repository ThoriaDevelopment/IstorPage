"317.92" y="79.61" width="11.89" height="48.39" fill="var(--mist)"/><rect x="332.02" y="74.81" width="11.89" height="53.19" fill="var(--mist)"/><rect x="346.11" y="70.00" width="11.89" height="58.00" fill="var(--mist)"/><rect x="22" y="218" width="336" height="58" fill="var(--subtle)"/><rect x="22.00" y="227.28" width="11.89" height="48.72" fill="var(--mist)"/><rect x="36.09" y="223.80" width="11.89" height="52.20" fill="var(--witness)"/><rect x="50.18" y="225.54" width="11.89" height="50.46" fill="var(--mist)"/><rect x="64.27" y="222.64" width="11.89" height="53.36" fill="var(--mist)"/><text x="22" y="26" font-family="Inter, system-ui, sans-serif" font-size="15" fill="var(--mist)">one document, two ways to read it</text><text x="22" y="56" font-family="Inter, system-ui, sans-serif" font-size="15" fill="var(--ink)">the whole document, one window</text><text x="358" y="56" font-family="JetBrains Mono, ui-monospace, Consolas, monospace" font-size="15" fill="var(--ink)" font-weight="600" text-anchor="end">24</text><text x="22" y="149" font-family="Inter, system-ui, sans-serif" font-size="15" fill="var(--witness)" font-weight="600">the early detail</text><text x="22" y="172" font-family="Inter, system-ui, sans-serif" font-size="15" fill="var(--mist)">the early detail: 31% of the end’s weight</text><text x="22" y="204" font-family="Inter, system-ui, sans-serif" font-size="15" fill="var(--ink)">the handful that bear on the question</text><text x="358" y="204" font-family="JetBrains Mono, ui-monospace, Consolas, monospace" font-size="15" fill="var(--ink)" font-weight="600" text-anchor="end">4</text><text x="22" y="297" font-family="Inter, system-ui, sans-serif" font-size="15" fill="var(--witness)" font-weight="600">the early detail</text><text x="22" y="320" font-family="Inter, system-ui, sans-serif" font-size="15" fill="var(--mist)">the same detail: 98% of this window’s best</text><text x="22" y="352" font-family="Inter, system-ui, sans-serif" font-size="15" fill="var(--m