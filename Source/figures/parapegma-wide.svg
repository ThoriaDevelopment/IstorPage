    <text class="pp-key" x="342.4" y="526.0" font-size="12.5" font-family="GFS Didot, Georgia, serif">Σ</text>
    <text class="pp-greek" x="368.4" y="526.0" font-size="12.5" font-family="GFS Didot, Georgia, serif">[...]</text>
    <text class="pp-key" x="16.0" y="543.0" font-size="12.5" font-family="GFS Didot, Georgia, serif">Θ</text>
    <text class="pp-greek" x="44.0" y="543.0" font-size="12.5" font-family="GFS Didot, Georgia, serif">[...]</text>
    <text class="pp-key" x="342.4" y="543.0" font-size="12.5" font-family="GFS Didot, Georgia, serif">Τ</text>
    <text class="pp-greek" x="368.4" y="543.0" font-size="12.5" font-family="GFS Didot, Georgia, serif">[...]</text>
    <text class="pp-key" x="16.0" y="560.0" font-size="12.5" font-family="GFS Didot, Georgia, serif">Ι</text>
    <text class="pp-greek" x="44.0" y="560.0" font-size="12.5" font-family="GFS Didot, Georgia, serif">ΤΟΞΟΤΗΣ ΑΡΧΕΤΑΙ ΕΠΙΤΕΛΛΕΙΝ [...] Α</text>
    <text class="pp-key" x="342.4" y="560.0" font-size="12.5" font-family="GFS Didot, Georgia, serif">Υ</text>
    <text class="pp-greek" x="368.4" y="560.0" font-size="12.5" font-family="GFS Didot, Georgia, serif">[...]</text>
    <text class="pp-key" x="16.0" y="577.0" font-size="12.5" font-family="GFS Didot, Georgia, serif">Κ</text>
    <text class="pp-greek" x="44.0" y="577.0" font-size="12.5" font-family="GFS Didot, Georgia, serif">[...]</text>
    <text class="pp-key" x="342.4" y="577.0" font-size="12.5" font-family="GFS Didot, Georgia, serif">Φ</text>
    <text class="pp-greek" x="368.4" y="577.0" font-size="12.5" font-family="GFS Didot, Georgia, serif">[...]</text>
    <text class="pp-key" x="16.0" y="594.0" font-size="12.5" font-family="GFS Didot, Georgia, serif">Λ</text>
    <text class="pp-greek" x="44.0" y="594.0" font-size="12.5" font-family="GFS Didot, Georgia, serif">[...]</text>
    <text class="pp-key" x="342.4" y="594.0" font-size="12.5" font-family="GFS Didot, Georgia, serif">Χ</text>
