<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 452" width="380" height="452" role="img" aria-label="A library’s passages as positions. The two phrasings of one finding sit nearest each other; keywords reach the note that shares the words, and the near-neighbour circle reaches the subject across the wording." focusable="false" data-variant="tall"><rect x="12" y="52" width="356" height="318" fill="var(--subtle)"/><circle cx="221.41" cy="159.53" r="119.68" fill="none" stroke="var(--witness)" stroke-width="1.5" stroke-dasharray="5 4"/><line x1="221.41" y1="159.53" x2="60.00" y2="332.46" stroke="var(--mist)" stroke-width="1.5"/><circle cx="118.22" cy="182.34" r="5" fill="var(--witness)"/><circle cx="136.16" cy="207.22" r="5" fill="var(--witness)"/><circle cx="48.17" cy="240.29" r="4.4" fill="var(--mist)"/><circle cx="60.00" cy="332.46" r="4.4" fill="var(--mist)"/><circle cx="168.02" cy="363.46" r="4.4" fill="var(--mist)"/><circle cx="219.55" cy="367.09" r="4.4" fill="var(--mist)"/><path d="M221.405 163.529 l7 -12 h-14 z" fill="var(--witness)"/><text x="22" y="26" font-family="Inter, system-ui, sans-serif" font-size="15" fill="var(--mist)">one library, two ways to reach it</text><text x="128.216" y="186.338" font-family="Inter, system-ui, sans-serif" font-size="15" fill="var(--ink)">a paper: efficacy</text><text x="146.162" y="211.221" font-family="Inter, system-ui, sans-serif" font-size="15" fill="var(--ink)">a thesis: how well it worked</text><text x="58.1709" y="244.293" font-family="Inter, system-ui, sans-serif" font-size="15" fill="var(--ink)">a paper: adverse events</text><text x="70.0041" y="336.462" font-family="Inter, system-ui, sans-serif" font-size="15" fill="var(--ink)">a note: drug safety</text><text x="211.405" y="145.529" font-family="Inter, system-ui, sans-serif" font-size="15" fill="var(--witness)" font-weight="600" text-anchor="end">the question: drug safety</text><text x="22" y="404" font-family="Inter, system-ui, sans-serif" font-size="15" fill="var(--mist)">keywords reach the wording, not the subject</text><text x="22" y="424" font-family="Inter, system-ui, sans-serif" font-size="15" fill="var(--ink)" font-weight="600">nearness reaches across the wording</text></svg>