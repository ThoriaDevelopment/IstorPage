<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 520"
     class="poster-horizon" aria-hidden="true" focusable="false">
  <!-- The calendar ring's 355 holes, at a radius that turns its arc into the
       close's horizon. Generated by Source/tools/make-poster-horizon.py — do not
       hand-edit; the geometry is arithmetic and the script prints its own check. -->
  <defs>
    <radialGradient id="poster-glow" gradientUnits="userSpaceOnUse"
                    cx="0" cy="0" r="680"
                    gradientTransform="translate(720 260) scale(1 0.35)">
      <stop offset="0" stop-color="var(--field-ink)" stop-opacity="0.09"/>
      <stop offset="0.45" stop-color="var(--field-ink)" stop-opacity="0.034"/>
      <stop offset="1" stop-color="var(--field-ink)" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- The wash: the face of the limb. Its centre is deliberately below the apex,
       so the glow arrives at neither edge of this viewBox and is never cropped
       into a straight line. See the note in make-poster-horizon.py. -->
  <rect width="1440" height="520" fill="url(#poster-glow)"/>

  <!-- The mechanism's plates under the ring: concentric hole rows, each lower
       and fainter than the one above, which is how the eye reads depth in a
       stacked machine. See LAYERS in make-poster-horizon.py. -->
  <g class="horizon-layer">
    <circle cx="720" cy="1000.0" r="962" fill="none" stroke="var(--field-ink)" stroke-width="1.4" stroke-opacity="0.3"/>
    <circle cx="720" cy="1000.0" r="953" fill="none" stroke="var(--field-ink)" stroke-width="4.2" stroke-opacity="0.16" stroke-linecap="round" stroke-dasharray="0.02 17.00655" transform="rotate(-449.49296 720 1000.0)"/>
  </g>
  <g class="horizon-layer">
    <circle cx="720" cy="1000.0" r="910" fill="none" stroke="var(--field-ink)" stroke-width="1.4" stroke-opacity="0.18"/>
    <circle cx="720" cy="1000.0" r="901" fill="none" stroke="var(--field-ink)" stroke-width="4.2" stroke-opacity="0.09" stroke-linecap="round" stroke-dasharray="0.02 16.08619" transform="rotate(-449.49296 720 1000.0)"/>
  </g>
  <g class="horizon-layer">
    <circle cx="720" cy="1000.0" r="840" fill="none" stroke="var(--field-ink)" stroke-width="1.4" stroke-opacity="0.1"/>
    <circle cx="720" cy="1000.0" r="831" fill="none" stroke="var(--field-ink)" stroke-width="4.2" stroke-opacity="0.045" stroke-linecap="round" stroke-dasharray="0.02 14.84726" transform="rotate(-449.49296 720 1000.0)"/>
  </g>

  <!-- The limb itself: four strokes of one circle, widest and faintest first. A
       stacked stroke rather than a blur filter, because a filter's cost and its
       result both vary by renderer and this has to look identical everywhere. -->
  <g>
    <circle cx="720" cy="1000.0" r="1000" fill="none" stroke="var(--field-ink)" stroke-width="58" stroke-opacity="0.035"/>
    <circle cx="720" cy="1000.0" r="1000" fill="none" stroke="var(--field-ink)" stroke-width="30" stroke-opacity="0.055"/>
    <circle cx="720" cy="1000.0" r="1000" fill="none" stroke="var(--field-ink)" stroke-width="14" stroke-opacity="0.095"/>
    <circle cx="720" cy="1000.0" r="1000" fill="none" stroke="var(--field-ink)" stroke-width="3.2" stroke-opacity="0.3"/>
  </g>

  <!-- All 355 holes along that edge, as one dashed circle. pathLength is not used
       so the dash arithmetic stays literal and cannot drift between renderers. -->
  <circle cx="720" cy="1000.0" r="1000" fill="none"
          stroke="var(--field-ink)" stroke-width="7" stroke-linecap="round"
          stroke-opacity="0.5" stroke-dasharray="0.02 17.67911"
          transform="rotate(-449.49296 720 1000.0)"/>

  <!-- The disputed hole, at the apex, in the plate's own --azure. The figure's
       single piece of information, as it is on the plate. -->
  <circle cx="720" cy="0" r="5.04" fill="var(--azure)"/>
</svg>
