<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 404" width="380" height="404" role="img" aria-label="Four example speeds against the reading bar at six pieces per second: 4 under it, 12 clearing it, 25 faster than reading, 90 a datacenter number. While one answer is written the rate drifts from 30 to 18 and finishes above the bar." focusable="false" data-variant="tall"><rect x="22" y="172" width="336" height="2" fill="var(--subtle)"/><rect x="21.00" y="166.00" width="2.00" height="14.00" fill="var(--mist)"/><rect x="105.00" y="166.00" width="2.00" height="14.00" fill="var(--mist)"/><rect x="189.00" y="166.00" width="2.00" height="14.00" fill="var(--mist)"/><rect x="273.00" y="166.00" width="2.00" height="14.00" fill="var(--mist)"/><rect x="357.00" y="166.00" width="2.00" height="14.00" fill="var(--mist)"/><rect x="41.16" y="76" width="2.00" height="96" fill="var(--witness)"/><rect x="22" y="329.50" width="336" height="2.00" fill="var(--witness)"/><path d="M22 276.5 L78 283.25 L134 290 L190 294.5 L246 299 L302 301.25 L358 303.5" fill="none" stroke="var(--mist)" stroke-width="3"/><text x="22" y="26" font-family="Inter, system-ui, sans-serif" font-size="15" fill="var(--mist)">the axis is the page's own: pieces per second</text><text x="22" y="56" font-family="Inter, system-ui, sans-serif" font-size="15" fill="var(--ink)">four example speeds, one bar</text><text x="35.44" y="116.32" font-family="JetBrains Mono, ui-monospace, Consolas, monospace" font-size="15" fill="var(--ink)" text-anchor="middle">4</text><text x="22" y="213" font-family="Inter, system-ui, sans-serif" font-size="15" fill="var(--mist)">under the bar</text><text x="62.32" y="116.32" font-family="JetBrains Mono, ui-monospace, Consolas, monospace" font-size="15" fill="var(--ink)" text-anchor="middle">12</text><text x="22" y="191" font-family="Inter, system-ui, sans-serif" font-size="15" fill="var(--mist)">clears the bar</text><text x="106" y="116.32" font-family="JetBrains Mono, ui-monospace, Consolas, monospace" font-size="15" fill="var(--ink)" text-anchor="middle">25</text><text x="106" y="235" font-family="Inter, system-ui, sans-serif" font-size="15" fill="var(--mist)" text-anchor="middle">faster than reading</text><text x="324.4" y="116.32" font-family="JetBrains Mono, ui-monospace, Consolas, monospace" font-size="15" fill="var(--ink)" text-anchor="middle">90</text><text x="358" y="191" font-family="Inter, system-ui, sans-serif" font-size="15" fill="var(--mist)" text-anchor="end">a datacenter number</text><text x="52.16" y="94" font-family="Inter, system-ui, sans-serif" font-size="15" fill="var(--witness)" font-weight="600">the reading bar</text><text x="22" y="256" font-family="Inter, system-ui, sans-serif" font-size="15" fill="var(--ink)">the rate while one answer is written</text><text x="24" y="305.459" font-family="JetBrains Mono, ui-monospace, Consolas, monospace" font-size="15" fill="var(--ink)">starts at 30</text><text x="356" y="287.5" font-family="JetBrains Mono, ui-monospace, Consolas, monospace" font-size="15" fill="var(--ink)" text-anchor="end">ends at 18</text><text x="22" y="322.5" font-family="Inter, system-ui, sans-serif" font-size="15" fill="var(--witness)">the reading bar</text><text x="22" y="368" font-family="Inter, system-ui, sans-serif" font-size="15" fill="var(--mist)">Speeds are examples, not measurements.</text><text x="22" y="386" font-family="Inter, system-ui, sans-serif" font-size="15" fill="var(--mist)">The bar sits in the five-to-ten band.</text></svg>