name: Deploy istor.fyi

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # make-didot-greek.py (M37a) rebuilds the display face from the committed
      # master at gate time. Its encoder is fontTools (third-party, not stdlib)
      # and fontTools' WOFF2 writer needs brotli with it. Without these lines
      # every push since M37a failed the figures gate on the runner while every
      # local run passed - the dev machine has both packages installed.
      # (An import sweep of Source/tools found PIL/numpy only in make-ground and
      # make-og-card, neither of which the CI gates run; odds is a committed
      # sibling module. fontTools+brotli is the whole external set.)
      - name: Install the third-party dependencies the gates need
        run: pip install fonttools brotli pypdf

      - name: Assert that every figure is what its generator writes
        run: python Source/tools/verify-figures.py

      - name: Assemble the site
        run: python Source/tools/build-site.py

      - name: Assert the manifest and the payload
        run: python Source/tools/verify-budget.py _site

      - name: Assert that every link resolves
        run: python Source/tools/verify-links.py _site

      # The sheet, read back. M60 found a page whose printed sheet went blank
      # while every other gate stayed green - the cold states hid on paper and
      # no gate read the sheet. This one prints the built landing headlessly
      # and asserts, in the extracted text, that what the cold states hide is
      # actually there (the reading log's rows, the plates' drawn strings, the
      # accordion's answers printed open). A rule that re-arms a cold state on
      # paper, or re-closes a disclosure, now fails before it ships. Needs
      # headless Chrome, which ubuntu-latest carries.
      - name: Assert that the printed sheet carries the page
        run: python Source/tools/verify-print.py --site _site

      - name: Assert that no visible copy carries an AI tell
        run: python Source/tools/verify-copy.py _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # THE STALE-ARTIFACT GUARD. The deploy was red for three days (2026-09-23
      # to 26) while every local gate stayed green: istor.fyi served a build that
      # predated the Greek language tags, the skip-link target, the chip relabel
      # and the last five figure families, and nothing in this workflow noticed,
      # because every step before this one runs against the artifact BEFORE it
      # ships. This step runs against the site AFTER it ships, and asserts the
      # markers of the current handoff in the served bytes. A deploy that
      # silently no-ops, a CDN serving a cached generation, a future gate added
      # to build but not to this workflow - anything that leaves production
      # behind the repository now fails the run instead of shipping quietly.
      - name: Smoke-test what actually shipped
        run: |
          sleep 20
          PAGE=$(curl -fsSL --max-time 30 https://istor.fyi/)
          fail() { echo "STALE DEPLOY: $1"; exit 1; }
          echo "$PAGE" | grep -q 'What are the cycles?' \
            || fail "the ask-chip relabel is not live"
          echo "$PAGE" | grep -q 'id="the-answer" tabindex="-1"' \
            || fail "the skip-link target is not live"
          echo "$PAGE" | grep -q 'xml:lang="el"' \
            || fail "the Greek language tags are not live"
          echo "$PAGE" | grep -q 'mechanism’s own manual' \
            || fail "the curly-apostrophe typography is not live"
          # One marker per act of the landing's act-index nav, in the nav's own
          # order: a build that loses any act - or any act's current words -
          # fails the run, not just a build that loses the newest plate. Each
          # string is the act's own prose, stable until the act is rewritten,
          # and re-verified against the built page before landing.
          echo "$PAGE" | grep -q 'what it saw' \
            || fail "the hero is not live"
          echo "$PAGE" | grep -q 'It checks what you already gave it.' \
            || fail "the gate act is not live"
          echo "$PAGE" | grep -q 'Every claim points at a passage.' \
            || fail "the passage act is not live"
          echo "$PAGE" | grep -q 'On your machine.' \
            || fail "the machine act is not live"
          echo "$PAGE" | grep -q 'The library is the interface.' \
            || fail "the library act is not live"
          echo "$PAGE" | grep -q 'Where it refuses.' \
            || fail "the stop act is not live"
          echo "$PAGE" | grep -q '354.08' \
            || fail "the evidence act is not live"
          echo "$PAGE" | grep -q 'Four of the seven answers below' \
            || fail "the questions act is not live"
          echo "$PAGE" | grep -q 'the old Greek word for a witness' \
            || fail "the name act is not live"
          LIBPAGE=$(curl -fsSL --max-time 30 https://istor.fyi/what-is-quantization/)
          echo "$LIBPAGE" | grep -q 'bar lengths are the files’ true proportions' \
            || fail "the gap session's figure apostrophes are not live"
          echo "smoke ok - the shipped page carries the handoff markers and one marker per act"
