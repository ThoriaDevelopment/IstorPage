name: Deploy istor.fyi

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # make-didot-greek.py (M37a) rebuilds the display face from the committed
      # master at gate time, and its WOFF2 encoder is fontTools - a third-party
      # package, not stdlib. Without this line every push since M37a failed the
      # figures gate here with "No module named fontTools", while every local
      # run passed because the dev machine has the package installed.
      # (An import sweep of Source/tools found PIL/numpy only in make-ground and
      # make-og-card, neither of which the CI gates run; fontTools is the one
      # package the gated path imports.)
      - name: Install the one third-party dependency the gates need
        run: pip install fonttools

      - name: Assert that every figure is what its generator writes
        run: python Source/tools/verify-figures.py

      - name: Assemble the site
        run: python Source/tools/build-site.py

      - name: Assert the manifest and the payload
        run: python Source/tools/verify-budget.py _site

      - name: Assert that every link resolves
        run: python Source/tools/verify-links.py _site

      - name: Assert that no visible copy carries an AI tell
        run: python Source/tools/verify-copy.py _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
